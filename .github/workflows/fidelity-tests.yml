name: Fidelity tests

on: pull_request

jobs:
  compare_renders:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    # dspbr-pt and glTF-Sample-Renderer are file: dependencies, so they must
    # be cloned (at the commits pinned in the script) before npm ci
    - name: Fetch renderers
      run: node scripts/fetch-renderers.js

    - name: NPM install
      run: npm ci

    - name: Fetch renderer runtimes
      run: npm run setup

    - name: Build packages
      run: |
       npm run build

    - name: Fidelity tests
      uses: GabrielBB/xvfb-action@v1.0
      with:
        run: npm run test -- --quiet
