name: Deploy documentation 

on:
  push:
    branches:
      - main

jobs:
  deploy_github_pages:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    # dspbr-pt and glTF-Sample-Renderer are file: dependencies, so they must
    # be cloned (at the commits pinned in the script) before npm ci
    - name: Fetch renderers
      run: node scripts/fetch-renderers.js

    - name: NPM install
      run: npm ci

    - name: Fetch renderer runtimes
      run: npm run setup

    - name: Build packages
      run: npm run build

    - name: Generate fidelity artifacts 
      continue-on-error: true
      uses: coactions/setup-xvfb@v1
      with:
        run: npm run test

    - name: Stage documentation artifacts
      run: |
        mkdir -p pages/comparison
        mv test/results pages/comparison/
        cp test/results-viewer.html pages/comparison/index.html
        cp -r dist glTF-Sample-Assets pages/
        cp test/index-redirect.html pages/index.html
        git log -n 1 > pages/VERSION

    - name: Deploy to Github Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        force_orphan: true
        publish_dir: ./pages
